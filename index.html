<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            overflow: hidden;
        }

        h1 {
            margin-top: 100px;
            font-size: 40px;
            color: #ff1a75;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #yes {
            background-color: #ff4d94;
            color: white;
        }

        #no {
            background-color: #999;
            color: white;
            position: absolute;
        }
    </style>
</head>

<body>

<h1>Amayy<3 Moi Biss! Will You Be My Valentine? 💖</h1>

<button id="yes" onclick="sayYes()">Yes ❤️</button>
<button id="no">No 💔</button>

<script>
    const noBtn = document.getElementById("no");

    function moveButton() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("click", moveButton);

    function sayYes() {
        document.body.innerHTML = "<h1>OFCOURSE 💍💖 YOU GOT NO OTHER OPTION!!! With Love Suchiii<3</h1>";
    }
</script>

</body>
</html>
